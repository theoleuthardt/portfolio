<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none">
  <defs>
    <filter id="rust" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.09 0.05" numOctaves="5" seed="11"/>
      <feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.2  0 0 0 0 0.06  0 0 0 -5 2.6"/>
    </filter>
    <radialGradient id="corner" r="0.5">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <mask id="edges" maskContentUnits="objectBoundingBox">
      <rect width="1" height="1" fill="#000"/>
      <circle cx="0" cy="1" r="0.22" fill="url(#corner)"/>
      <circle cx="1" cy="0" r="0.12" fill="url(#corner)"/>
    </mask>
  </defs>
  <rect width="100" height="100" filter="url(#rust)" mask="url(#edges)"/>
</svg>
