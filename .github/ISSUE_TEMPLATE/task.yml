name: Task
description: A feature, refactor, docs or tooling task
body:
  - type: input
    id: epic
    attributes:
      label: Epic
      description: Parent epic issue, e.g. #18
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
